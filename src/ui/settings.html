<div class="settings-controls" aria-label="Звук и музыка">
  <button
    type="button"
    class="setting-toggle"
    data-preference="sound"
    aria-label="Звук"
    aria-pressed="true"
  >
    <span class="setting-icon speaker-icon"><i data-lucide="volume-2" aria-hidden="true"></i></span>
    <span class="setting-off-mark"><i data-lucide="slash" aria-hidden="true"></i></span>
  </button>
  <button
    type="button"
    class="setting-toggle"
    data-preference="music"
    aria-label="Музыка"
    aria-pressed="true"
  >
    <span class="setting-icon music-icon"><i data-lucide="music" aria-hidden="true"></i></span>
    <span class="setting-off-mark"><i data-lucide="slash" aria-hidden="true"></i></span>
  </button>
</div>
<p class="music-status" role="status" hidden></p>
