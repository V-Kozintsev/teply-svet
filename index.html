<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102f3c" />
    <title>Тёплый свет</title>
    <script src="./game-language.js"></script>
    <!-- critical-boot-styles -->
  </head>
  <body>
    <section id="loading" class="boot loading-screen" aria-label="Загрузка игры">
      <div class="loading-card">
        <span class="loading-house" aria-hidden="true"></span>
        <h1 id="loading-label" class="loading-title" role="status">Зажигаем свет…</h1>
        <div class="loading-track loading-pipe">
          <span class="loading-pipe-glass" aria-hidden="true">
            <span class="loading-pipe-current"><span class="loading-pipe-wave"></span></span>
          </span>
          <progress id="loading-progress" max="1" aria-labelledby="loading-label"></progress>
        </div>
        <p id="loading-detail" class="loading-detail">Готовим уютный вечер</p>
        <div class="loading-actions">
          <button
            id="loading-retry"
            class="loading-retry"
            type="button"
            hidden
            onclick="location.reload()"
          >
            Повторить
          </button>
        </div>
      </div>
    </section>
    <main id="app" aria-busy="true" hidden></main>
    <noscript><p>Чтобы открыть игру, включите JavaScript в браузере.</p></noscript>
    <script>
      (() => {
        let ready = false;
        const fail = () => {
          if (ready) return;
          clearTimeout(slow);
          document.getElementById('loading').dataset.state = 'error';
          document.getElementById('loading-label').textContent = 'Не удалось загрузить игру';
          document.getElementById('loading-detail').textContent =
            'Проверьте подключение и попробуйте ещё раз.';
          document.getElementById('loading-retry').hidden = false;
        };
        const slow = setTimeout(() => {
          if (ready || document.getElementById('loading').dataset.state === 'error') return;
          document.getElementById('loading').dataset.state = 'slow';
          document.getElementById('loading-detail').textContent = navigator.onLine
            ? 'Связь медленная. Ещё немного…'
            : 'Нет связи. Ждём подключение…';
        }, 6000);
        const watchdog = setTimeout(fail, 60000);
        const syncLoadingMotion = () =>
          document.documentElement.style.setProperty(
            '--loading-motion',
            document.hidden ? 'paused' : 'running',
          );
        document.addEventListener('visibilitychange', syncLoadingMotion);
        syncLoadingMotion();
        window.addEventListener(
          'menu-ready',
          () => {
            ready = true;
            clearTimeout(slow);
            clearTimeout(watchdog);
          },
          { once: true },
        );
        window.addEventListener(
          'error',
          (event) => {
            if (event.target instanceof HTMLScriptElement) fail();
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
